<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leben">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mein Leben</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Lagune bei Tag / Ozean bei Nacht. Tagesbogen-Hero oben, Reiter als Pillen, Übersicht als Bento-Raster, Listen in zwei Spalten ab Desktop. */
:root{
--bg:#e9f0ef;--card:#ffffff;--hi:#f3f7f6;--tx:#0f2629;--mu:#5b7275;--bd:#d5e1df;
--ac:#0b7a75;--ac2:#0a5f5b;--sun:#ea6a3f;--neg:#c2453d;--ok:#2f8f5b;
--sh:0 1px 2px rgba(15,38,41,.05),0 6px 24px -12px rgba(15,38,41,.18);
--fd:"Bricolage Grotesque","Inter",system-ui,sans-serif;--fb:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
--r:18px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081214;--card:#0f1c1f;--hi:#0b1719;--tx:#e3eeec;--mu:#88a1a3;--bd:#1d3034;--ac:#3cc1b4;--ac2:#62d6ca;--sun:#ff8a5c;--neg:#f07a71;--ok:#5fcf8f;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#081214;--card:#0f1c1f;--hi:#0b1719;--tx:#e3eeec;--mu:#88a1a3;--bd:#1d3034;--ac:#3cc1b4;--ac2:#62d6ca;--sun:#ff8a5c;--neg:#f07a71;--ok:#5fcf8f;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15.5px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* Hero */
.hero{padding-block:18px 6px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{margin:0;color:var(--mu);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(1.7rem,4.6vw,2.5rem);line-height:1.05;margin:4px 0 0;letter-spacing:-.02em;text-wrap:balance}
.icon-btn{border:1px solid var(--bd);background:var(--card);border-radius:12px;height:40px;min-width:40px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mu)}
.icon-btn:hover{color:var(--tx);border-color:var(--ac)}
.hero-acts{display:flex;gap:8px}
.hero-card{margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);padding:14px 18px 16px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:center;position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;inset:auto -10% -60% -10%;height:120%;background:radial-gradient(closest-side,color-mix(in srgb,var(--sun) 16%,transparent),transparent);pointer-events:none}
#arc{width:100%;display:block;position:relative;z-index:1}
.arc-bg{fill:none;stroke:var(--bd);stroke-width:3;stroke-dasharray:2 6;stroke-linecap:round}
.arc-fg{fill:none;stroke:var(--sun);stroke-width:3;stroke-linecap:round}
.arc-hz{stroke:var(--bd);stroke-width:1.5}
.arc-sun{fill:var(--sun)}.arc-glow{fill:var(--sun);opacity:.18}
.arc-l{fill:var(--mu);font:600 10px var(--fb)}
.arc-p{fill:var(--tx);font:800 34px var(--fd);text-anchor:middle;letter-spacing:-.02em}
.arc-s{fill:var(--mu);font:500 10.5px var(--fb);text-anchor:middle}
.hero-side{position:relative;z-index:1;display:grid;gap:12px;min-width:0}
.pace{margin:0;font-family:var(--fd);font-size:1.18rem;font-weight:700;line-height:1.25;text-wrap:balance}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;flex-direction:column;gap:1px;padding:8px 12px;border-radius:14px;background:var(--hi);border:1px solid var(--bd);min-width:96px}
.pill small{font-size:.7rem;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.pill b{font-variant-numeric:tabular-nums;font-size:1.02rem}
.pill.hot b{color:var(--sun)}
.tbar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--sun));border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tt{color:var(--mu);font-size:.82rem}

/* Nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.navin{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin button{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.88rem;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.navin button:hover{border-color:var(--ac)}
.navin button .ic{margin-right:6px}
.navin button.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}

/* Main */
main{padding-block:6px 110px}
.cols{columns:2 400px;column-gap:16px}
.cols>.card{break-inside:avoid}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid .card{margin:0}
.grid .w{grid-column:1/-1}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.hero-card{grid-template-columns:minmax(0,1fr);gap:6px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--sh);min-width:0;animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.card h2{font-family:var(--fd);font-weight:700;font-size:1.08rem;letter-spacing:-.01em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h2 span{font-family:var(--fb);font-weight:500;color:var(--mu);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bd);border-radius:6px;margin-bottom:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .4s}
.bar i.neg{background:var(--neg)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.row.f{border-top:0}
.row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--bd);border-radius:7px;flex:none;cursor:pointer;display:grid;place-items:center;margin:0;transition:all .15s;background:var(--card)}
.row input[type=checkbox]:hover{border-color:var(--ac)}
.row input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
.row input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.row label,.row .t{flex:1;word-break:break-word;min-width:0}
.row label{cursor:pointer}
.row.done label{text-decoration:line-through;color:var(--mu)}
.row .a{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row .a.n{color:var(--neg)}
.row button{background:none;border:0;color:var(--mu);font-size:1.15rem;padding:4px 8px;cursor:pointer;border-radius:8px;opacity:.55}
.row:hover button,.row button:focus-visible{opacity:1}
.row button:hover{background:var(--hi);color:var(--neg)}
.add{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.add input,textarea,select.gi,.gi{background:var(--hi);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
.add input{flex:1 1 140px}
.add input.am{flex:0 0 96px}
.add input:focus,textarea:focus,.gi:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.add button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:0 16px;min-height:42px;font-size:1.15rem;font-weight:600;cursor:pointer}
.add button:hover{background:var(--ac2)}
.add button.ghost{background:var(--hi);color:var(--tx);border:1px solid var(--bd)}
textarea{width:100%;min-height:140px;resize:vertical;line-height:1.5}
.mood{display:flex;gap:8px}
.mood button{flex:1;font-size:1.5rem;padding:10px 0;border-radius:14px;border:2px solid var(--bd);background:var(--hi);cursor:pointer;transition:transform .15s}
.mood button:hover{transform:translateY(-2px)}
.mood button.on{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 12%,var(--card))}
.empty{color:var(--mu);font-size:.86rem;padding:4px 0}
.b1{fill:var(--ac)}.b0{fill:var(--bd)}.b2{fill:var(--sun)}.bl{stroke:var(--bd);stroke-width:1}
.tl{fill:var(--mu);font-size:9px;text-anchor:middle;font-family:var(--fb)}
.rg{fill:none;stroke:var(--bd);stroke-width:10}.rf{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.mr{display:grid;grid-template-columns:84px 1fr 96px;gap:10px;align-items:center;font-size:.9rem;padding:5px 0}
.mr .bar{margin:0}.mr b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.gi{width:90px;flex:none;padding:7px 8px;border-radius:10px}
.ring{display:flex;align-items:center;gap:16px}.ring svg{width:110px;flex:none}
.big{font-family:var(--fd);font-size:1.9rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.wg{fill:none;stroke:var(--bd)}.wf{fill:var(--ac);fill-opacity:.25;stroke:var(--ac);stroke-width:2}
details{margin:6px 0}summary{cursor:pointer;color:var(--mu)}
input[type=range]{accent-color:var(--ac);width:100%}
.chips{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.chips button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--bd);background:var(--hi);font-size:.85rem;cursor:pointer;min-width:42px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
/* Heatmap */
.h0{fill:var(--hi);stroke:var(--bd);stroke-width:.6}
.h1{fill:color-mix(in srgb,var(--ac) 28%,var(--hi))}
.h2{fill:color-mix(in srgb,var(--ac) 55%,var(--hi))}
.h3{fill:color-mix(in srgb,var(--ac) 82%,var(--hi))}
.h4{fill:var(--sun)}
.hx{fill:none;stroke:var(--tx);stroke-width:1.4}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:.75rem;color:var(--mu);margin-top:6px}
.legend svg{width:14px;height:14px}
.scroll-x{overflow-x:auto}
/* Sport */
.sportbtn{width:100%;padding:16px;border-radius:14px;border:2px dashed var(--bd);background:var(--hi);font-weight:700;font-size:1rem;cursor:pointer;transition:all .2s}
.sportbtn:hover{border-color:var(--ok)}
.sportbtn.on{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.sportbtn:disabled{cursor:default;opacity:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;text-align:center}
.wd{font-size:.7rem;color:var(--mu);font-weight:600}
.wd i{display:grid;place-items:center;height:32px;border-radius:10px;background:var(--hi);border:1px solid var(--bd);margin-top:3px;font-style:normal;font-size:.85rem;color:var(--mu);font-variant-numeric:tabular-nums}
.wd i.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.wd i.td{outline:2px solid var(--sun);outline-offset:1px}
.ex{border-top:1px solid var(--bd);padding:14px 0 6px;margin-top:10px}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex-h b{font-family:var(--fd);font-size:1.08rem}
.delta{color:var(--ok);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.z{color:var(--mu);font-weight:500}
.ex-s{color:var(--mu);font-size:.82rem;margin-top:2px}
.spk{width:100%;height:auto;max-height:90px;display:block;margin:8px 0}
.spk .ln{fill:none;stroke:var(--ac);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spk .ar{fill:var(--ac);opacity:.12}.spk .pt{fill:var(--sun)}.spk .p0{fill:var(--mu)}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini button{border:1px solid var(--bd);background:var(--hi);border-radius:10px;padding:7px 11px;font-size:.82rem;cursor:pointer}
.mini button:hover{border-color:var(--ac)}
.pill.ok b{color:var(--ok)}
/* Fokus */
.focus{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.focus svg{width:132px;flex:none}
.focus .ctl{flex:1;min-width:180px}
.fz-time{fill:var(--tx);font:800 24px var(--fd);text-anchor:middle;font-variant-numeric:tabular-nums}
.focus .rf{stroke:var(--sun);transition:none}
/* FAB + Palette */
#fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;height:56px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--tx);color:var(--bg);font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);transition:transform .15s}
#fab:hover{transform:translateY(-2px)}
#fab span{font-size:1.5rem;line-height:1;font-weight:400}
#fab kbd{font:500 .7rem var(--fb);opacity:.6;border:1px solid currentColor;border-radius:5px;padding:1px 5px}
@media (max-width:600px){#fab kbd{display:none}}
#pal{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:calc(10vh + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#pal[hidden]{display:none!important}
.pal-box{width:100%;max-width:560px;background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);padding:14px;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
#pal-in{width:100%;border:0;background:transparent;font-size:1.2rem;padding:8px 6px;outline:none;color:var(--tx);font-family:var(--fd);font-weight:500}
.pal-row{display:flex;gap:8px;align-items:center;border-top:1px solid var(--bd);padding-top:10px;margin-top:4px;flex-wrap:wrap}
.pal-row label{color:var(--mu);font-size:.85rem}
#pal-to{flex:1;min-width:150px;background:var(--hi);border:1px solid var(--bd);border-radius:10px;padding:8px}
#pal-add{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
#pal-res{margin-top:8px;max-height:44vh;overflow:auto}
#pal-res button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer}
#pal-res button:hover,#pal-res button:focus-visible{background:var(--hi)}
#pal-res small{display:block;color:var(--mu);font-size:.75rem}
.pal-hint{color:var(--mu);font-size:.75rem;margin-top:8px;padding:0 4px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:500;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
@media (max-width:760px){
nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--bd);background:color-mix(in srgb,var(--card) 90%,transparent)}
.navin{padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));gap:4px}
.navin button{border:0;background:transparent;padding:6px 10px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.navin button .ic{font-size:1.25rem;line-height:1;margin:0}
.navin button.on{background:var(--hi);color:var(--tx);border:0}
main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));height:52px}
#toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
@media (display-mode:standalone){.hero{padding-top:8px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero wrap">
  <div class="hero-top">
    <div><p class="eyebrow" id="date"></p><h1 id="hi">Hallo Pascal</h1></div>
    <div class="hero-acts"><button id="th" class="icon-btn" aria-label="Farbschema wechseln" title="Farbschema">◐ <span id="thl">Auto</span></button></div>
  </div>
  <div class="hero-card">
    <svg id="arc" viewBox="0 0 320 132" role="img" aria-label="Tagesbogen"></svg>
    <div class="hero-side">
      <p class="pace" id="pace"></p>
      <div class="pills" id="pills"></div>
      <div class="tbar"><i id="tp" style="width:0"></i></div>
      <div class="tt" id="tt"></div>
    </div>
  </div>
</header>
<nav><div class="navin wrap" id="nav"></div></nav>
<main id="app" class="wrap"></main>
<button id="fab" aria-label="Schnell erfassen"><span>+</span> Erfassen <kbd>⌘K</kbd></button>
<div id="pal" hidden>
  <div class="pal-box" role="dialog" aria-label="Schnell erfassen oder suchen">
    <input id="pal-in" placeholder="Gedanke notieren oder alles durchsuchen …" autocomplete="off">
    <div class="pal-row"><label for="pal-to">Ablegen in</label><select id="pal-to"></select><button id="pal-add">Hinzufügen</button></div>
    <div id="pal-res"></div>
    <div class="pal-hint">Enter legt ab · Esc schließt · ⌘K oder / öffnet · Tasten 1–9 und 0 wechseln die Reiter</div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx"></canvas>

<script>
function ld(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
var KEY='life-dash-v2',today=ld(new Date());
// [id, Titel, Typ]
var TABS=[
['📊 Übersicht',[['ov','','overview']]],
['🌅 Heute',[['tplan','Heute geplant','tplan'],['focus','Fokus-Timer','focus'],['routine','Tagesroutine','daily'],['top3','Top 3 heute','daily'],['planer','Aufgabenplaner','plan'],['rec','Wiederkehrende Aufgaben','rec'],['termin','Termine & Fristen','dates'],['mood','Energie heute','mood'],['sportday','Heute beim Sport?','sportday']]],
['💼 Business',[['umsatz','Umsatz','rev'],['pipe','Kunden-Pipeline','pipe'],['bweek','Diese Woche','list'],['bproj','Projekte','list'],['bkund','Kunden & Akquise','list'],['bidee','Business-Ideen','list']]],
['🎬 Content',[['cidee','Ideen','list'],['cwip','In Arbeit','list'],['cdone','Veröffentlicht','list'],['chook','Hooks & Sätze','list']]],
['💪 Körper',[['sportday','Heute beim Sport?','sportday'],['log','Übungen & Fortschritt','log'],['hab','Gewohnheiten heute','daily'],['sport','Sport-Plan','list'],['gesund','Termine & Check-ups','list']]],

function confetti(n){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;var c=g('fx'),x=c.getContext('2d'),W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio,cs=getComputedStyle(document.documentElement),cols=[cs.getPropertyValue('--ac'),cs.getPropertyValue('--sun'),'#f7c948',cs.getPropertyValue('--ok'),'#7ab8ff'],P=[];for(var i=0;i<n;i++)P.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*26*devicePixelRatio,vy:(-Math.random()*22-8)*devicePixelRatio,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,s:(Math.random()-.5)*.4});var f=0;(function step(){x.clearRect(0,0,W,H);P.forEach(function(p){p.vy+=.7*devicePixelRatio;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r*devicePixelRatio/2,-p.r*devicePixelRatio/4,p.r*devicePixelRatio,p.r*devicePixelRatio/2);x.restore()});if(++f<130)requestAnimationFrame(step);else x.clearRect(0,0,W,H)})()}
